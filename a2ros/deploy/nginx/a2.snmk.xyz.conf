# ============================================================
# Nginx reverse proxy for A2 Revenue OS  ->  https://a2.snmk.xyz
# Install:
#   sudo cp deploy/nginx/a2.snmk.xyz.conf /etc/nginx/sites-available/a2.snmk.xyz
#   sudo ln -s /etc/nginx/sites-available/a2.snmk.xyz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: see deploy/SSL.md (Let's Encrypt via certbot, or Cloudflare Origin cert).
# ============================================================

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name a2.snmk.xyz;

    # Allow Let's Encrypt HTTP-01 challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name a2.snmk.xyz;

    # --- TLS certificates ---
    # Let's Encrypt (certbot) paths:
    ssl_certificate     /etc/letsencrypt/live/a2.snmk.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a2.snmk.xyz/privkey.pem;
    # --- OR Cloudflare Origin certificate ---
    # ssl_certificate     /etc/ssl/cloudflare/a2.snmk.xyz.pem;
    # ssl_certificate_key /etc/ssl/cloudflare/a2.snmk.xyz.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:A2SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    # Serve static assets directly for speed.
    location /static/ {
        alias /opt/a2ros/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
