# PDF Editing & Security Suite — Proxmox stack
#
#   caddy    -> public entry point: HTTPS for pdf.snmk.xyz (auto Let's Encrypt)
#   gateway  -> branded login + dashboard, reverse-proxies into Stirling-PDF
#   stirling -> the actual PDF engine (edit / convert / security tools)
#
# Only Caddy is published. The gateway and Stirling-PDF stay private on the
# internal network, so every request enters via HTTPS and passes the login.

services:
  stirling:
    image: stirlingtools/stirling-pdf:latest
    container_name: pdfsuite-stirling
    restart: unless-stopped
    # NOTE: no "ports:" on purpose — Stirling is private, behind the gateway.
    expose:
      - "8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"   # gateway handles auth, not Stirling
      SYSTEM_DEFAULTLOCALE: "en-US"
      LANGS: "en_GB"
      SYSTEM_MAXFILESIZE: "200"          # MB upload limit
    volumes:
      - stirling_tessdata:/usr/share/tessdata   # OCR language packs
      - stirling_configs:/configs
      - stirling_logs:/logs
    networks:
      - pdfnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  gateway:
    build: ./gateway
    container_name: pdfsuite-gateway
    restart: unless-stopped
    # No public port — reachable only through Caddy on the internal network.
    expose:
      - "3000"
    environment:
      PORT: "3000"
      STIRLING_URL: "http://stirling:8080"
      GATEWAY_USER: "${GATEWAY_USER:-pdf}"
      GATEWAY_PASS: "${GATEWAY_PASS:-1}"
      SESSION_SECRET: "${SESSION_SECRET:-please-change-this-secret}"
      SITE_TITLE: "${SITE_TITLE:-PDF Studio}"
    depends_on:
      - stirling
    networks:
      - pdfnet

  caddy:
    image: caddy:2-alpine
    container_name: pdfsuite-caddy
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP -> auto-redirects to HTTPS / ACME challenge
      - "443:443"    # HTTPS for pdf.snmk.xyz
      - "443:443/udp"  # HTTP/3
    environment:
      DOMAIN: "${DOMAIN:-pdf.snmk.xyz}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates (persist across restarts)
      - caddy_config:/config
    depends_on:
      - gateway
    networks:
      - pdfnet

networks:
  pdfnet:
    driver: bridge

volumes:
  stirling_tessdata:
  stirling_configs:
  stirling_logs:
  caddy_data:
  caddy_config:
