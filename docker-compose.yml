# PDF Editing & Security Suite — Proxmox stack (private, via Cloudflare Tunnel)
#
#   cloudflared -> outbound-only tunnel to Cloudflare; serves pdf.snmk.xyz
#   gateway     -> branded login + dashboard, reverse-proxies into Stirling-PDF
#   stirling    -> the actual PDF engine (edit / convert / security tools)
#
# NOTHING publishes a host port. The only path in is the Cloudflare Tunnel,
# which dials OUT to Cloudflare — so the suite is never exposed to the public
# internet and needs no public IP / port-forwarding. Restrict who can reach it
# with a Cloudflare Access policy (see README) so only you can log in.

services:
  stirling:
    image: stirlingtools/stirling-pdf:latest
    container_name: pdfsuite-stirling
    restart: unless-stopped
    # NOTE: no "ports:" on purpose — Stirling is private, behind the gateway.
    expose:
      - "8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"   # gateway handles auth, not Stirling
      SYSTEM_DEFAULTLOCALE: "en-US"
      LANGS: "en_GB"
      SYSTEM_MAXFILESIZE: "200"          # MB upload limit
    volumes:
      - stirling_tessdata:/usr/share/tessdata   # OCR language packs
      - stirling_configs:/configs
      - stirling_logs:/logs
    networks:
      - pdfnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  gateway:
    build: ./gateway
    container_name: pdfsuite-gateway
    restart: unless-stopped
    # Published on the LAN so Cloudflare Tunnel (or a reverse proxy) can use
    # http://<this-host-LAN-IP>:8088 as the origin.
    ports:
      - "8088:3000"
    environment:
      PORT: "3000"
      STIRLING_URL: "http://stirling:8080"
      GATEWAY_USER: "${GATEWAY_USER:-pdf}"
      GATEWAY_PASS: "${GATEWAY_PASS:-1}"
      SESSION_SECRET: "${SESSION_SECRET:-please-change-this-secret}"
      SITE_TITLE: "${SITE_TITLE:-PDF Studio}"
    depends_on:
      - stirling
    networks:
      - pdfnet

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pdfsuite-cloudflared
    restart: unless-stopped
    # Outbound-only connection to Cloudflare. No ports are published.
    command: tunnel --no-autoupdate run
    environment:
      # Token from: Cloudflare Zero Trust > Networks > Tunnels > (your tunnel).
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}"
    depends_on:
      - gateway
    networks:
      - pdfnet

networks:
  pdfnet:
    driver: bridge

volumes:
  stirling_tessdata:
  stirling_configs:
  stirling_logs:
