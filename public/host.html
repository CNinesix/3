<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Share screen — WebView Remote</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1>Share this screen</h1>
      <a class="back" href="index.html">← back</a>
      <span id="status" class="status">idle</span>
    </div>

    <div class="row">
      <button id="startBtn">Start sharing</button>
      <span>Session ID:</span>
      <span id="sessionId" class="session-id">— — —</span>
    </div>

    <div class="row" style="margin-top:12px;">
      <label class="row" style="gap:6px;">
        Max FPS
        <select id="fpsSelect">
          <option>30</option>
          <option selected>60</option>
          <option>120</option>
        </select>
      </label>
      <label class="row" style="gap:6px;">
        Bitrate
        <select id="bitrateSelect">
          <option value="2">2 Mb/s</option>
          <option value="5" selected>5 Mb/s</option>
          <option value="10">10 Mb/s</option>
          <option value="20">20 Mb/s</option>
        </select>
      </label>
    </div>

    <div class="stage">
      <video id="preview" autoplay muted playsinline></video>
    </div>

    <p class="note">
      Mouse/keyboard events from viewers are received over a data channel and
      logged below. A native agent would inject them into the OS here.
    </p>
    <div id="log" class="log"></div>
  </div>

  <script type="module" src="host.js"></script>
</body>
</html>
