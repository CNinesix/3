<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect — WebView Remote</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1>Connect to a screen</h1>
      <a class="back" href="index.html">← back</a>
      <span id="status" class="status">idle</span>
    </div>

    <div class="row">
      <input id="sessionInput" type="text" placeholder="Session ID" maxlength="9" />
      <button id="joinBtn">Connect</button>
      <label class="row" style="gap:6px;">
        <input type="checkbox" id="controlToggle" checked /> send my input
      </label>
      <span id="gamepadStatus" class="status">no gamepad</span>
    </div>

    <div class="stage">
      <video id="remote" autoplay playsinline tabindex="0"></video>
      <div id="stats" class="stats hidden">
        <span><b id="statRtt">—</b> ms rtt</span>
        <span><b id="statFps">—</b> fps</span>
        <span><b id="statBitrate">—</b> Mb/s</span>
        <span><b id="statJitter">—</b> ms jitter</span>
        <span><b id="statRes">—</b></span>
      </div>
    </div>

    <p class="note">
      Click the video to capture keyboard/mouse. Connect a controller and press
      a button to enable gamepad passthrough (Parsec-style).
    </p>
    <div id="log" class="log"></div>
  </div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
